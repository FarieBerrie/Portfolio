<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9a6bff" />
      <stop offset=".55" stop-color="#6a35ff" />
      <stop offset="1" stop-color="#4a22c4" />
    </linearGradient>
    <radialGradient id="planet" cx=".34" cy=".3" r=".8">
      <stop offset="0" stop-color="#ffe4ff" />
      <stop offset=".3" stop-color="#e88cf2" />
      <stop offset=".62" stop-color="#9a3fd6" />
      <stop offset="1" stop-color="#2a0f6b" />
    </radialGradient>
  </defs>
  <rect width="32" height="32" rx="8" fill="url(#tile)" />
  <g transform="translate(16 16.5) rotate(-18)">
    <!-- The ring passes behind the planet, then its near half crosses in front -->
    <ellipse rx="13" ry="4.3" fill="none" stroke="#ffd6f5" stroke-opacity=".55" stroke-width="1.8" />
    <circle r="7.6" fill="url(#planet)" transform="rotate(18)" />
    <path d="M-13 0A13 4.3 0 0 0 13 0" fill="none" stroke="#ffd6f5" stroke-width="2" stroke-linecap="round" />
  </g>
  <path d="M25.5 4.5l.7 1.8 1.8.7-1.8.7-.7 1.8-.7-1.8-1.8-.7 1.8-.7z" fill="#fff" />
